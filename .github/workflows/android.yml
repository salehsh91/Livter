name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev gettext patch ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 "cython==0.29.37" setuptools

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          # `< <(yes)` answers any prompt with "y" without breaking pipefail
          buildozer android debug < <(yes) 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        shell: bash
        run: |
          # strip color codes and cut very long compiler lines so the summary stays readable
          sed 's/\x1b\[[0-9;]*m//g' build.log | cut -c1-300 > clean.log
          {
            echo "## Last 80 lines of the build log"
            echo '```'
            tail -n 80 clean.log
            echo '```'
            echo "## Real error markers (last 30)"
            echo '```'
            grep -n -E "Traceback|Command failed|BUILD FAILED|FAILURE:|fatal error|error:|CalledProcessError|Exception|No matching|undefined reference|No space left" clean.log | tail -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Livter-APK
          path: bin/*.apk
