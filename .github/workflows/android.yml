    - name: Prepare python-for-android
      run: |
        buildozer android update

        P4A_BUILD=".buildozer/android/platform/python-for-android"

        if [ -f "$P4A_BUILD/pythonforandroid/build.py" ]; then
          sed -i "s/shprint(host_python, '-m', 'venv', 'venv')/shprint(host_python, '-m', 'venv', '--clear', 'venv')/" \
            "$P4A_BUILD/pythonforandroid/build.py"
        fi

        grep -n "venv.*clear" "$P4A_BUILD/pythonforandroid/build.py"