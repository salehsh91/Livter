name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.37

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Prepare Buildozer
        run: |
          buildozer android debug --help

      - name: Patch python-for-android venv creation
        run: |
          P4A_DIR=".buildozer/android/platform/python-for-android"

          if [ -f "$P4A_DIR/pythonforandroid/build.py" ]; then
            sed -i \
              "s/host_python, '-m', 'venv', 'venv'/host_python, '-m', 'venv', '--clear', 'venv'/" \
              "$P4A_DIR/pythonforandroid/build.py"
          fi

          grep -n "venv" "$P4A_DIR/pythonforandroid/build.py" | tail -10

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Livter-Android
          path: bin/*.apk
          if-no-files-found: error