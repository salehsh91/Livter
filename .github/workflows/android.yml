name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          cmake \
          libffi-dev \
          libssl-dev

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        python -m pip install \
          buildozer==1.6.0 \
          cython==0.29.37

    - name: Clean old Buildozer files
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Patch python-for-android venv creation
      run: |
        P4A_BUILD="$HOME/.buildozer/android/platform/python-for-android/pythonforandroid/build.py"

        if [ ! -f "$P4A_BUILD" ]; then
          echo "python-for-android build.py not found"
          exit 1
        fi

        python - <<'PY'
        from pathlib import Path
        import os

        p = Path.home() / ".buildozer/android/platform/python-for-android/pythonforandroid/build.py"
        s = p.read_text()

        old = "shprint(host_python, '-m', 'venv', 'venv')"
        new = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"

        if old not in s:
            print("Target line not found.")
            raise SystemExit(1)

        s = s.replace(old, new, 1)
        p.write_text(s)

        print("Patched:", p)
        print("venv creation now uses --clear")
        PY

    - name: Build APK
      run: |
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Livter-APK
        path: bin/*.apk